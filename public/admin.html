<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - Rifa</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f2f2; margin: 0; padding: 0; }
    header { background: #4CAF50; color: white; padding: 20px; text-align: center; }
    h1 { margin: 0; }
    .container { max-width: 900px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: center; }
    th { background: #4CAF50; color: white; }
    tr:hover { background-color: #f1f1f1; }
    .status-available { color: #4CAF50; font-weight: bold; }
    .status-held { color: #FF9800; font-weight: bold; }
    .status-sold { color: #C70039; font-weight: bold; }
    #refreshBtn { background: #FF5733; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 6px; margin-top: 10px; }
    #refreshBtn:hover { background: #C70039; }
  </style>
</head>
<body>
  <header>
    <h1>Painel Admin - Rifa</h1>
  </header>

  <div class="container">
    <button id="refreshBtn">Atualizar Dados</button>
    <table id="ticketsTable">
      <thead>
        <tr>
          <th>Número</th>
          <th>Status</th>
          <th>E-mail do Comprador</th>
          <th>Criado em</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="4">Carregando dados...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    async function fetchTickets() {
      try {
        const res = await fetch('/admin/data');
        const data = await res.json();
        const tbody = document.querySelector('#ticketsTable tbody');
        tbody.innerHTML = '';
        data.forEach(ticket => {
          const tr = document.createElement('tr');

          const statusClass = ticket.status === 'available' ? 'status-available' :
                              ticket.status === 'held' ? 'status-held' :
                              'status-sold';

          tr.innerHTML = `
            <td>${ticket.number}</td>
            <td class="${statusClass}">${ticket.status}</td>
            <td>${ticket.payer_email || '-'}</td>
            <td>${ticket.criado_em}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error("Erro ao carregar tickets:", err);
        const tbody = document.querySelector('#ticketsTable tbody');
        tbody.innerHTML = `<tr><td colspan="4">Erro ao carregar dados.</td></tr>`;
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', fetchTickets);
    window.onload = fetchTickets; // carrega automaticamente ao abrir a página
  </script>
</body>
</html>
