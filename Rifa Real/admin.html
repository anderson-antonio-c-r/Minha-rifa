<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Painel Administrativo da Rifa</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
    table { border-collapse: collapse; width: 100%; background: white; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #333; color: white; }
    .sold { background: #ffdddd; }
    .held { background: #fff7cc; }
    .available { background: #ddffdd; }
  </style>
</head>
<body>
  <h1>Painel Administrativo da Rifa</h1>
  <p>Status dos 100 números (atualiza automaticamente):</p>
  <table id="raffleTable">
    <thead>
      <tr>
        <th>Número</th>
        <th>Status</th>
        <th>Email do Comprador</th>
        <th>Preference ID</th>
        <th>Data de Criação</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function carregar() {
      const res = await fetch('/admin/data');
      const data = await res.json();
      const tbody = document.querySelector('#raffleTable tbody');
      tbody.innerHTML = '';
      data.forEach(r => {
        const tr = document.createElement('tr');
        tr.className = r.status;
        tr.innerHTML = `
          <td>${r.number}</td>
          <td>${r.status}</td>
          <td>${r.payer_email || '-'}</td>
          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis">${r.preference_id || '-'}</td>
          <td>${r.criado_em || '-'}</td>
        `;
        tbody.appendChild(tr);
      });
    }
    carregar();
    setInterval(carregar, 10000);
  </script>
</body>
</html>
